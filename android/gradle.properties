# The self-hosted GitLab runner limits every job container to 2 GiB. Keep the
# Gradle JVM comfortably below that limit: Flutter, AAPT2 and native tooling
# need memory outside the Java heap as well.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
