# Lean CI for active development (saves GitLab shared-runner minutes).
# Quality gates (format/analyze/test) run locally:
#   ./scripts/validate.sh
# Full DevSecOps + APK artifact pipeline: `.gitlab-ci.full.yml`
# Enable full: CI/CD variable CI_PIPELINE_MODE=full
# Docs: tourism-platform/docs/ci-and-runners.md

include:
  - local: ".gitlab-ci.full.yml"
    rules:
      - if: '$CI_PIPELINE_MODE == "full"'

workflow:
  rules:
    - if: '$CI_PIPELINE_MODE == "full"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "gamma"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - lean
  - build
  - mirror

.flutter-image: &flutter-image ghcr.io/cirruslabs/flutter:3.44.0

.pub-cache: &pub-cache
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache
      - .dart_tool

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

ci-lean-notice:
  stage: lean
  image: alpine:3.21
  script:
    # Quote whole lines: YAML treats unquoted `key: value` as a mapping.
    - 'echo "Lean CI — Flutter style/tests run locally (./scripts/validate.sh)."'
    - 'echo "Signed APK: run job mobile-apk-test manually, or set CI_PIPELINE_MODE=full."'
  rules:
    - if: '$CI_PIPELINE_MODE == "full"'
      when: never
    - when: on_success

# Optional signed test APK (manual only in lean mode — does not auto-burn minutes).
mobile-apk-test:
  stage: build
  image: *flutter-image
  <<: *pub-cache
  needs:
    - ci-lean-notice
  script:
    - |
      if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] \
        || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_STORE_PASSWORD:-}" ] \
        || [ -z "${MOBILE_TEST_API_BASE_URL:-}" ]; then
        echo "Signing / API CI variables missing — cannot build signed APK."
        exit 1
      fi
    - bash scripts/ci-prepare-android-signing.sh
    - >
      ./scripts/build-signed-apk.sh
      --env test
      --data-source api
      --api-url "${MOBILE_TEST_API_BASE_URL}"
    - test -f dist/CrimeaTrip-test-api.apk
    - rm -f android/key.properties android/ci-upload.jks
  artifacts:
    name: "crimeatrip-apk-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/CrimeaTrip-test-api.apk
    expire_in: 14 days
    when: on_success
  rules:
    - if: '$CI_PIPELINE_MODE == "full"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "gamma"'
      when: manual
      allow_failure: true

github-mirror:
  stage: mirror
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/ci-mirror-to-github.sh
  rules:
    - if: '$CI_PIPELINE_MODE == "full"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "gamma" && $GITHUB_MIRROR_TOKEN'
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_MIRROR_TOKEN'
  needs:
    - ci-lean-notice
