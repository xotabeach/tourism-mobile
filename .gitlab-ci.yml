stages:
  - code-style
  - run-tests
  - mirror

mobile-code-style:
  stage: code-style
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - dart format --set-exit-if-changed lib test
    - flutter analyze --fatal-infos

mobile-run-tests:
  stage: run-tests
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter test
  # Security notes:
  # - flutter analyze + flutter test (includes test/security/)
  # - Enable GitLab Secret Detection template when tier confirmed:
  # include:
  #   - template: Security/Secret-Detection.gitlab-ci.yml
  allow_failure: false

# Public GitHub showcase mirror. GitLab remains source of truth.
github-mirror:
  stage: mirror
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/ci-mirror-to-github.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "gamma" && $GITHUB_MIRROR_TOKEN'
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_MIRROR_TOKEN'
  needs:
    - mobile-code-style
    - mobile-run-tests
