stages:
  - code-style
  - run-tests

mobile-code-style:
  stage: code-style
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - dart format --set-exit-if-changed lib test
    - flutter analyze --fatal-infos

mobile-run-tests:
  stage: run-tests
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter test
  # Security notes:
  # - flutter analyze + flutter test (includes test/security/)
  # - Enable GitLab Secret Detection template when tier confirmed:
  # include:
  #   - template: Security/Secret-Detection.gitlab-ci.yml
  allow_failure: false
