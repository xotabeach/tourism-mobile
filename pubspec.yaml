name: tourism_mobile
description: Crimea Travel Platform mobile client for Android and iOS.
publish_to: 'none'
version: 0.1.16+17

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # CocoaPods is more reliable here (Firebase + plugins with "+" in
  # versions). Flutter SPM was failing iOS resolve for image_picker_ios.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/raster/
    - assets/icons/raster/ink/
    - assets/icons/raster/muted/
    - assets/icons/raster/profile/
    - assets/icons/raster/accent/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-VariableFont_wght.ttf
